<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mes Repas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app-container">
    <header class="app-header">
      <h1 class="app-title">👨‍🍳 Mes Repas</h1>
    </header>

    <!-- Mes Ingrédients -->
    <section class="input-card">
      <h2 class="section-title">Mes ingrédients</h2>
      <div class="input-group">
        <input type="text" id="ingredientInput" placeholder="Ex: chicken, rice, tomato..." class="ingredient-input" />
        <button id="addBtn" class="btn-add">Ajouter</button>
      </div>
      <div id="tagsContainer" class="tags-container"></div>
    </section>

    <!-- Mode de cuisson -->
    <section class="cooking-section">
      <h2 class="section-title">Mode de cuisson</h2>
      <div class="cooking-grid">
        <button class="cooking-btn" data-mode="simple">
          <span class="cooking-icon">🍳</span>
          <span class="cooking-label">Cuisson simple</span>
        </button>
        <button class="cooking-btn active" data-mode="cookeo">
          <span class="cooking-icon">🍲</span>
          <span class="cooking-label">Cookeo</span>
        </button>
        <button class="cooking-btn" data-mode="airfryer">
          <span class="cooking-icon">🌀</span>
          <span class="cooking-label">Air Fryer</span>
        </button>
        <button class="cooking-btn" data-mode="raw">
          <span class="cooking-icon">🥗</span>
          <span class="cooking-label">Sans</span>
        </button>
      </div>
    </section>

    <!-- Bouton Central de recherche API -->
    <div class="action-container">
      <button id="searchBtn" class="btn-submit">🚀 C'est parti !</button>
    </div>

    <!-- Recettes -->
    <section class="recipes-section">
      <h2 id="recipesTitle" class="section-title">Recettes disponibles</h2>
      <div id="recipesList" class="recipes-list"></div>
    </section>

    <!-- Navigation du bas -->
    <nav class="bottom-nav">
      <button class="nav-btn" onclick="alert('Ma Liste')">📋 MA LISTE</button>
      <button class="nav-btn nav-btn-secondary" onclick="alert('Ma Semaine')">📅 MA SEMAINE</button>
    </nav>
  </div>

  <!-- Pop-up Modal Recette -->
  <div id="recipeModal" class="modal-overlay hidden">
    <div class="modal-content">
      <button id="closeModalBtn" class="close-btn">×</button>
      <div class="modal-header">
        <h2 id="modalTitle" class="modal-title"></h2>
        <div id="modalMeta" class="recipe-meta"></div>
      </div>
      <div class="modal-section">
        <h3 class="modal-section-title">Ingrédients</h3>
        <ul id="modalIngredients" class="ingredient-list"></ul>
      </div>
      <div class="modal-section">
        <h3 class="modal-section-title">Étapes de préparation</h3>
        <ol id="modalSteps" class="step-list"></ol>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
