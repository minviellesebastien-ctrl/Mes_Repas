<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mes Repas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app-container">
    <header class="app-header">
      <h1 class="app-title">
        <!-- SVG Toque de cuisinier -->
        <svg class="chef-hat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 10.58 0A4 4 0 0 1 18 13.87V21H6z"/>
          <line x1="6" y1="17" x2="18" y2="17"/>
        </svg>
        Mes Repas
      </h1>
    </header>

    <!-- Mes Ingrédients -->
    <section class="input-card">
      <h2 class="section-title ingredients-title">Mes ingrédients</h2>
      <div class="input-group">
        <input type="text" id="ingredientInput" placeholder="Ex: chicken, rice, tomato..." class="ingredient-input" />
        <button id="addBtn" class="btn-add">Ajouter</button>
      </div>
      <div id="tagsContainer" class="tags-container"></div>
    </section>

    <!-- Mode de cuisson -->
    <section class="cooking-section">
      <h2 class="section-title">Mode de cuisson</h2>
      <div class="cooking-grid">
        
        <!-- Cuisson simple -->
        <button class="cooking-btn" data-mode="simple">
          <svg class="cooking-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12h20"/>
            <path d="M20 12v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8"/>
            <path d="M4 8h16s-1-4-8-4-8 4-8 4z"/>
          </svg>
          <span class="cooking-label">Cuisson simple</span>
        </button>

        <!-- Cookeo -->
        <button class="cooking-btn active" data-mode="cookeo">
          <svg class="cooking-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="8" width="18" height="12" rx="3"/>
            <path d="M7 8V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v3"/>
            <circle cx="12" cy="14" r="2"/>
          </svg>
          <span class="cooking-label">Cookeo</span>
        </button>

        <!-- Air Fryer -->
        <button class="cooking-btn" data-mode="airfryer">
          <svg class="cooking-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/>
            <path d="M12 12e-1 4"/>
            <path d="M12 7v10"/>
            <path d="M7 12h10"/>
          </svg>
          <span class="cooking-label">Air Fryer</span>
        </button>

        <!-- Sans -->
        <button class="cooking-btn" data-mode="raw">
          <svg class="cooking-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.4 19 2c1 2 2 4.1 2 8a9 9 0 0 1-10 10z"/>
            <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
          </svg>
          <span class="cooking-label">Sans</span>
        </button>

      </div>
    </section>

    <!-- Bouton Central de recherche -->
    <div class="action-container">
      <button id="searchBtn" class="btn-submit">C'est parti</button>
    </div>

    <!-- Recettes -->
    <section class="recipes-section">
      <h2 id="recipesTitle" class="section-title">Recettes disponibles</h2>
      <div id="recipesList" class="recipes-list"></div>
    </section>

    <!-- Navigation du bas (Boutons inversés) -->
    <nav class="bottom-nav">
      <button class="nav-btn nav-btn-secondary" id="openSemaineBtn">📅 MA SEMAINE</button>
      <button class="nav-btn" id="openListeBtn">📋 MA LISTE</button>
    </nav>
  </div>

  <!-- Pop-up Modale Recette (Détails) -->
  <div id="recipeModal" class="modal-overlay hidden">
    <div class="modal-content">
      <button id="closeModalBtn" class="close-btn">×</button>
      <div class="modal-header">
        <h2 id="modalTitle" class="modal-title"></h2>
        <div id="modalMeta" class="recipe-meta"></div>
      </div>
      <div class="modal-section">
        <h3 class="modal-section-title">Ingrédients</h3>
        <ul id="modalIngredients" class="ingredient-list"></ul>
      </div>
      <div class="modal-section">
        <h3 class="modal-section-title">Étapes de préparation</h3>
        <ol id="modalSteps" class="step-list"></ol>
      </div>
    </div>
  </div>

  <!-- Pop-up Saisie "Ma Semaine" (Bottom Sheet - Half Screen) -->
  <div id="semaineModal" class="modal-overlay hidden">
    <div class="modal-bottom-sheet">
      <button class="close-btn" id="closeSemaineBtn">×</button>
      <h2 class="sheet-title">Ma Semaine</h2>
      <div class="sheet-body">
        <textarea placeholder="Planifiez vos repas de la semaine ici..." class="sheet-textarea"></textarea>
      </div>
    </div>
  </div>

  <!-- Pop-up Saisie "Ma Liste" (Bottom Sheet - Half Screen) -->
  <div id="listeModal" class="modal-overlay hidden">
    <div class="modal-bottom-sheet">
      <button class="close-btn" id="closeListeBtn">×</button>
      <h2 class="sheet-title">Ma Liste</h2>
      <div class="sheet-body">
        <textarea placeholder="Ajoutez vos articles pour la liste de courses..." class="sheet-textarea"></textarea>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
