<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Générateur de Recettes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">

    <!-- Écran Principal -->
    <div id="mainScreen" class="screen active-screen">
            <header class="app-header">
        <h1 class="app-title">
          <svg class="chef-hat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 13.87A6 6 0 0 1 7.41 2a6 6 0 0 1 10.18 4 6 6 0 0 1 1 11.87H5.41Z"/>
            <path d="M6 17h12"/>
            <path d="M6 21h12"/>
          </svg>
          Mes Repas
        </h1>
      </header>


            <div class="main-content">
        <!-- Cadre Ingrédients -->
        <div class="input-card">
          <h2 class="section-title ingredients-title">Mes Ingrédients</h2>
          <div class="input-group">
            <input type="text" id="ingredientInput" class="ingredient-input" placeholder="Ajouter un ingrédient...">
            <button id="addBtn" class="btn-add" type="button">Ajouter</button>
          </div>
          <div id="tagsContainer" class="tags-container"></div>
        </div>

        <!-- Mode de Cuisson -->
        <div class="cooking-section">
          <h2 class="section-title">Mode de Cuisson</h2>
          <div class="cooking-grid">
            
            <!-- Poêle / Four -->
            <button class="cooking-btn active" data-mode="simple" type="button">
              <svg class="cooking-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 13a6 6 0 0 0 6 6h4a6 6 0 0 0 6-6V9H3v4z"/>
                <path d="M19 11h4"/>
              </svg>
              <span class="cooking-label">Poêle/Four</span>
            </button>

            <!-- Cookeo -->
            <button class="cooking-btn" data-mode="cookeo" type="button">
              <svg class="cooking-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 10a8 8 0 0 1 16 0v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-7z"/>
                <path d="M2 12h2M20 12h2"/>
                <path d="M8 5h8"/>
                <circle cx="12" cy="14" r="2"/>
              </svg>
              <span class="cooking-label">Cookeo</span>
            </button>

            <!-- Air Fryer -->
            <button class="cooking-btn" data-mode="airfryer" type="button">
              <svg class="cooking-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="3" width="16" height="18" rx="3"/>
                <line x1="4" y1="11" x2="20" y2="11"/>
                <rect x="8" y="14" width="8" height="4" rx="1"/>
                <circle cx="12" cy="7" r="1.5"/>
              </svg>
              <span class="cooking-label">Air Fryer</span>
            </button>

            <!-- Sans Cuisson -->
            <button class="cooking-btn" data-mode="raw" type="button">
              <svg class="cooking-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.4 19 2c1 2 2 4.1 2 7 0 6-5 11-10 11z"/>
                <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
              </svg>
              <span class="cooking-label">Sans cuisson</span>
            </button>

          </div>
        </div>

        <!-- Bouton de Recherche -->
        <div class="action-container">
          <button id="searchBtn" class="btn-submit" type="button">C'est Parti !</button>
        </div>
            </div>
      

    <!-- Écran des Résultats -->
    <div id="resultsScreen" class="screen">
      <div class="results-header">
        <button id="backBtn" class="btn-back" type="button">← Retour</button>
        <h2 id="recipesTitle" class="section-title" style="margin: 0; font-size: 1.1rem;">Recettes</h2>
      </div>
      <div id="recipesList" class="recipes-list"></div>
    </div>

    <!-- Navigation du bas -->
    <nav class="bottom-nav">
      <button id="openSemaineBtn" class="nav-btn nav-btn-secondary" type="button">
        Ma Semaine
      </button>
      <button id="openListeBtn" class="nav-btn" type="button">
        Ma Liste
      </button>
    </nav>

    <!-- Modale Recette -->
    <div id="recipeModal" class="modal-overlay hidden">
      <div class="modal-content">
        <button id="closeModalBtn" class="close-btn" type="button">×</button>
        <h2 id="modalTitle" style="font-size: 1.1rem; color: var(--primary-dark); margin-bottom: 6px;"></h2>
        <p id="modalMeta" style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 14px;"></p>
        
        <h3 style="font-size: 0.9rem; color: var(--primary-green); margin-bottom: 6px;">Ingrédients</h3>
        <ul id="modalIngredients" style="list-style: none; padding: 0; margin-bottom: 14px;"></ul>
        
        <h3 style="font-size: 0.9rem; color: var(--primary-green); margin-bottom: 6px;">Préparation</h3>
        <ol id="modalSteps" style="padding-left: 0; list-style: none;"></ol>
      </div>
    </div>

    <!-- Modale Ma Semaine -->
    <div id="semaineModal" class="modal-overlay hidden">
      <div class="modal-bottom-sheet">
        <h2 class="sheet-title">Planning de la Semaine</h2>
        <div class="sheet-body">
          <textarea class="sheet-textarea" placeholder="Notez ici votre menu pour la semaine..."></textarea>
        </div>
        <button id="closeSemaineBtn" class="btn-submit" style="margin-top: 10px;" type="button">Fermer</button>
      </div>
    </div>

    <!-- Modale Ma Liste -->
    <div id="listeModal" class="modal-overlay hidden">
      <div class="modal-bottom-sheet">
        <h2 class="sheet-title">Liste de Courses</h2>
        <div class="sheet-body">
          <textarea class="sheet-textarea" placeholder="Ajoutez les articles à acheter..."></textarea>
        </div>
        <button id="closeListeBtn" class="btn-submit" style="margin-top: 10px;" type="button">Fermer</button>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
